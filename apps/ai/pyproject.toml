[project]
name = "metrascan-ai"
version = "0.1.0"
description = "MetraScan AI service: image quality analysis and OCR (provider-abstracted). Observations only — never legal decisions."
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pillow",
  "numpy",
  "opencv-python-headless",
  "pydantic>=2",
]

[project.optional-dependencies]
paddle = ["paddlepaddle", "paddleocr"]
tesseract = ["pytesseract"]
