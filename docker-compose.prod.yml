services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: metrascan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-metrascan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-metrascan}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metrascan-network

  # ---------------------------------------------------------------------------
  # AI Service: FastAPI + PaddleOCR (Image Quality & Text Extraction)
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: metrascan-ai
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set in production}
      OCR_PROVIDER: ${OCR_PROVIDER:-paddle}
      OCR_LANG: ${OCR_LANG:-en}
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H \"X-Internal-Token: $$AI_SERVICE_TOKEN\" http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metrascan-network

  # ---------------------------------------------------------------------------
  # Backend API: Node.js Express + Prisma + Legal Metrology Engine
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: metrascan-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@db:5432/${POSTGRES_DB:-metrascan}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and at least 32 characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set in production}
      STORAGE_PATH: /data/storage
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    volumes:
      - storage_data:/data/storage
    ports:
      - "${API_EXTERNAL_PORT:-4000}:4000"
    networks:
      - metrascan-network

  # ---------------------------------------------------------------------------
  # Frontend Web: React + Vite SPA served by Nginx (with reverse proxy to API)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: metrascan-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_EXTERNAL_PORT:-80}:80"
    networks:
      - metrascan-network

volumes:
  postgres_data:
    name: metrascan_postgres_data
  storage_data:
    name: metrascan_storage_data

networks:
  metrascan-network:
    name: metrascan_network
    driver: bridge
